name: crush_gear replay player — GitHub Pages

# crush_gear Phase 1-e §5 —— 建置 replay 播放器並部署到 GitHub Pages，
# 讓設計方能直接用手機開啟觀看。
#
# 這份是 `crush_gear/.github/workflows/pages.yml` 的根目錄適配版。
# GitHub Actions 只讀取 repo **根目錄**的 .github/workflows/，子目錄裡的不會執行，
# 因此本檔案存在於此，並以 defaults.run.working-directory 把 run 步驟切到 crush_gear/。
# `uses:` 步驟不受 working-directory 影響，故 artifact 的 path 明寫了 crush_gear/ 前綴。
#
# ## base path
#
# 站台掛在 https://<owner>.github.io/misc/ 底下，所有資產 URL 必須以 /misc/ 開頭。
# Vite 預設 base 是 `/`，直接部署會讓 index.html 去要 /assets/... 而 404 ——
# 畫面會是一片空白且沒有任何錯誤提示。這裡以 --base 指定，
# 不改 vite.config.ts（Phase 1-e 的絕對約束只允許動渲染層）。
# base 由 repo 名稱推導而非寫死，改名或 fork 都不會壞。

on:
  push:
    branches: [main]
    paths:
      - 'crush_gear/src/**'
      - 'crush_gear/index.html'
      - 'crush_gear/package-lock.json'
      - '.github/workflows/crush-gear-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署；新的 push 取消進行中的舊部署。
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: crush_gear

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crush_gear/package-lock.json

      # npm ci 而非 npm install：lock file 決定裝到哪一個 wasm binary。
      - run: npm ci

      # 播放器只是讀軌跡，但軌跡是由 src/sim 現場算出來的 ——
      # 部署一份跑不出正確結果的播放器沒有意義，因此建置前先驗一次。
      - name: Verify determinism fixtures
        run: npx tsx tools/verify-platform.ts --compare fixtures/platform/baseline.json

      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crush_gear/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
