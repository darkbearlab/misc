<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>超激力戰鬥車 — Replay 播放器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11141a;
        --panel: #191d26;
        --line: #2b3242;
        --text: #dbe2ee;
        --muted: #8b95a8;
        --accent: #4fa3ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, "Noto Sans TC", sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 300px;
        height: 100%;
      }
      .viewport {
        position: relative;
        min-width: 0;
      }
      .viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel {
        overflow-y: auto;
        padding: 14px;
        background: var(--panel);
        border-left: 1px solid var(--line);
      }
      .section {
        margin-bottom: 18px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
      }
      .row label {
        flex: 0 0 74px;
        color: var(--muted);
        font-size: 12px;
      }
      input,
      select {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        background: #0d1016;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        font: inherit;
      }
      .car-group {
        margin: 10px 0;
        padding: 8px 10px 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      legend {
        padding: 0 4px;
        color: var(--accent);
        font-weight: 600;
      }
      .buttons {
        flex-wrap: wrap;
      }
      button {
        flex: 1;
        padding: 6px 10px;
        background: #232936;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #08121e;
        font-weight: 600;
      }
      .timeline {
        width: 100%;
        margin: 8px 0 2px;
        padding: 0;
        accent-color: var(--accent);
      }
      .readout {
        margin-bottom: 8px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .checkrow {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 3px;
        cursor: pointer;
        user-select: none;
      }
      .checkrow input {
        flex: 0 0 auto;
        width: auto;
        accent-color: var(--accent);
      }
      /* 疊圖的浮動數值標籤：投影到 3D 座標上，不攔截滑鼠 */
      .label-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .overlay-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(9, 12, 18, 0.78);
        color: #cfe4ff;
        font: 11px/1.4 ui-monospace, "Cascadia Mono", monospace;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .overlay-label.small {
        font-size: 10px;
        color: #ffd88a;
      }
      .overlay-label.warn {
        background: rgba(120, 40, 10, 0.85);
        color: #ffd0a0;
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .outcome {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
